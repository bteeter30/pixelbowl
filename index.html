<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridiron Football</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button,select{
  padding:9px;
  border:0;
  border-radius:7px;
  font-weight:bold;
}

button{
  background:#facc15;
  color:#111;
  cursor:pointer;
}

.secondary{
  background:#29415b;
  color:#fff;
}

#menu{
  max-width:850px;
  margin:auto;
  padding:18px;
  height:100vh;
  overflow:auto;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:block;
  margin:12px 0;
}

select{
  width:100%;
  background:#29415b;
  color:#fff;
}

#game{
  display:none;
  height:100vh;
  position:relative;
}

#field{
  position:absolute;
  inset:0;
  background:#218448;
  border:4px solid #fff;
  overflow:hidden;
}

#field:before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    90deg,
    transparent 0 9.09%,
    #ffffff22 9.09% 9.18%
  );
}

.yard{
  position:absolute;
  top:0;
  bottom:0;
  width:1px;
  background:#fff9;
}

.yard span{
  position:absolute;
  top:12px;
  left:4px;
  font-size:13px;
  font-weight:bold;
}

.endzone{
  position:absolute;
  top:0;
  bottom:0;
  width:10%;
  border:3px solid #fff;
  display:grid;
  place-items:center;
  font-weight:bold;
  writing-mode:vertical-rl;
  font-size:13px;
  z-index:1;
}

.player{
  position:absolute;
  width:34px;
  height:34px;
  transform:translate(-50%,-50%);
  border:3px solid #fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:8px;
  font-weight:bold;
  z-index:4;
  transition:left .12s,top .12s;
}

.selected{
  box-shadow:0 0 0 4px #facc15;
}

#los{
  position:absolute;
  top:0;
  bottom:0;
  width:3px;
  background:#38bdf8;
  z-index:2;
}

#losLabel{
  position:absolute;
  top:45px;
  left:5px;
  font-size:10px;
  font-weight:bold;
  white-space:nowrap;
}

#ball{
  position:absolute;
  width:13px;
  height:13px;
  background:#8b4513;
  border:2px solid #fff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:6;
}

#message,
#controls,
#receivers,
#scoreboard{
  position:absolute;
  z-index:10;
  background:#101b2cee;
  border:1px solid #53677b;
  border-radius:9px;
  padding:9px;
}

#message{
  top:10px;
  left:50%;
  transform:translateX(-50%);
  max-width:90%;
  text-align:center;
}

#controls{
  left:10px;
  bottom:110px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  max-width:360px;
}

#receivers{
  right:10px;
  bottom:110px;
}

#scoreboard{
  left:0;
  right:0;
  bottom:0;
}

#scoreline{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:8px;
  text-align:center;
  font-size:11px;
}

#scoreline b{
  display:block;
  color:#facc15;
  font-size:17px;
}

#playClock.warning{
  color:#ff5555;
}

#movement{
  position:absolute;
  top:10px;
  left:10px;
  z-index:10;
  display:grid;
  grid-template-columns:repeat(3,38px);
  gap:4px;
}

#movement button:nth-child(1){
  grid-column:2;
}

#movement button:nth-child(2){
  grid-column:1;
  grid-row:2;
}

#movement button:nth-child(3){
  grid-column:2;
  grid-row:2;
}

#movement button:nth-child(4){
  grid-column:3;
  grid-row:2;
}

#movement button:nth-child(5){
  grid-column:2;
  grid-row:3;
}

@media(max-width:600px){
  .player{
    width:28px;
    height:28px;
    font-size:7px;
  }

  #controls{
    max-width:235px;
    bottom:125px;
  }

  #receivers{
    bottom:125px;
  }

  #scoreline{
    gap:4px;
    font-size:9px;
  }

  #scoreline b{
    font-size:13px;
  }
}
  <button onclick="startGame()">START GAME</button>
</section>

<section id="game">

  <div id="field">
    <div id="los">
      <span id="losLabel"></span>
    </div>

    <div id="ball"></div>
  </div>

  <div id="message">Press SNAP to begin</div>

  <div id="movement">
    <button onclick="move(0,-2)">▲</button>
    <button onclick="move(-2,0)">◀</button>
    <button onclick="move(0,2)">▼</button>
    <button onclick="move(2,0)">▶</button>
    <button onclick="move(0,-2)">▲</button>
  </div>

  <div id="controls">
    <button onclick="snap()">SNAP</button>
    <button onclick="runPlay()">RUN</button>
    <button onclick="passPlay()">PASS</button>
    <button onclick="punt()">PUNT</button>
    <button onclick="fullscreenGame()">⛶ FULLSCREEN</button>
    <button class="secondary" onclick="backToMenu()">MENU</button>
  </div>

  <div id="receivers">
    <b>PASS TO</b><br>
    <button onclick="chooseReceiver('WR1')">WR1</button>
    <button onclick="chooseReceiver('WR2')">WR2</button>
    <button onclick="chooseReceiver('TE')">TE</button>
"use strict";

const $ = id => document.getElementById(id);

const teams = {
  DET:["Detroit Lions","#0076b6","#b0b7bc"],
  CLE:["Cleveland Browns","#ff3c00","#311d00"],
  DAL:["Dallas Cowboys","#003594","#869397"],
  BUF:["Buffalo Bills","#00338d","#c60c30"],
  GB:["Green Bay Packers","#203731","#ffb612"],
  PHI:["Philadelphia Eagles","#004c54","#a5acaf"],
  KC:["Kansas City Chiefs","#e31837","#ffb81c"],
  SF:["San Francisco 49ers","#aa0000","#b3995d"],
  LV:["Las Vegas Raiders","#000","#a5acaf"],
  MIA:["Miami Dolphins","#008e97","#fc4c02"],
  NE:["New England Patriots","#002244","#c60c30"],
  NYJ:["New York Jets","#125740","#fff"],
  NYG:["New York Giants","#0b2265","#a71930"],
  PIT:["Pittsburgh Steelers","#101820","#ffb612"],
  BAL:["Baltimore Ravens","#241773","#9e7c0c"],
  CIN:["Cincinnati Bengals","#fb4f14","#000"],
  HOU:["Houston Texans","#03202f","#a71930"],
  IND:["Indianapolis Colts","#002c5f","#a2aaad"],
  JAX:["Jacksonville Jaguars","#006778","#d7a22a"],
  TEN:["Tennessee Titans","#0c2340","#4b92db"],
  DEN:["Denver Broncos","#fb4f14","#002244"],
  LAC:["Los Angeles Chargers","#0080c6","#ffc20e"],
  LAR:["Los Angeles Rams","#003594","#ffa300"],
  ARI:["Arizona Cardinals","#97233f","#000"],
  CHI:["Chicago Bears","#0b162a","#c83803"],
  MIN:["Minnesota Vikings","#4f2683","#ffc62f"],
  NO:["New Orleans Saints","#d3bc8d","#101820"],
  CAR:["Carolina Panthers","#0085ca","#101820"],
  ATL:["Atlanta Falcons","#a71930","#000"],
  TB:["Tampa Bay Buccaneers","#d50a0a","#ff7900"],
  SEA:["Seattle Seahawks","#002244","#69be28"],
  WAS:["Washington Commanders","#5a1414","#ffb612"]
};

for(const [key,team] of Object.entries(teams)){
  $("home").add(new Option(team[0],key));
  $("away").add(new Option(team[0],key));
}

$("away").selectedIndex=1;

const offenseFormation=[
  ["LT",38,37],
  ["LG",38,44],
  ["C",38,50],
  ["RG",38,56],
  ["RT",38,63],
  ["QB",43,50],
  ["RB",47,50],
  ["FB",46,42],
  ["WR1",38,13],
  ["WR2",38,87],
  ["TE",38,70]
];

const defenseFormation=[
  ["DE1",43,35],
  ["DT1",43,44],
  ["NT",43,50],
  ["DT2",43,56],
  ["DE2",43,65],
  ["LB1",49,40],
  ["LB2",49,50],
  ["LB3",49,60],
  ["CB1",48,13],
  ["CB2",48,87],
  ["S1",55,35],
  ["S2",55,65]
];

let homeTeam;
let awayTeam;
let allPlayers=[];
let defensePlayers=[];
let quarterback;

let gameClock=300;
let quarter=1;
let down=1;
let yardsToGo=10;
let homeScore=0;
let awayScore=0;

let possession="HOME";
let ballYard=25;
let live=false;
let selectedReceiver="WR1";
let playClock=40;
let playTimer=null;

function message(text){
  $("message").textContent=text;
}

function startGame(){

  homeTeam=teams[$("home").value];
  awayTeam=teams[$("away").value];

  $("menu").style.display="none";
  $("game").style.display="block";

  gameClock=300;
  quarter=1;
  down=1;
  yardsToGo=10;
  homeScore=0;
  awayScore=0;
  possession="HOME";
  ballYard=25;
  live=false;

  $("field").style.filter=
    $("weather").value==="Night"
    ?"brightness(.55)"
    :"none";

  $("homeLabel").textContent=homeTeam[0];
  $("awayLabel").textContent=awayTeam[0];

  buildField();
  buildPlayers();
  resetPlayClock();
  update();

  message("Ready. Press SNAP.");
}

function buildField(){

  const field=$("field");

  field.innerHTML=
    '<div id="los"><span id="losLabel"></span></div>'+
    '<div id="ball"></div>';

  const awayEnd=document.createElement("div");

  awayEnd.className="endzone";
  awayEnd.style.left="0";
  awayEnd.style.background=awayTeam[1];
  awayEnd.textContent=awayTeam[0];

  field.append(awayEnd);

  const homeEnd=document.createElement("div");

  homeEnd.className="endzone";
  homeEnd.style.right="0";
  homeEnd.style.background=homeTeam[1];
  homeEnd.textContent=homeTeam[0];

  field.append(homeEnd);

  for(let i=10;i<100;i+=10){

    const yard=document.createElement("div");

    yard.className="yard";
    yard.style.left=i+"%";
    yard.innerHTML=
      "<span>"+Math.min(i,100-i)+"</span>";

    field.append(yard);
  }
}

function buildPlayers(){

  allPlayers=[];

  const offense=
    offenseFormation.map(
      p=>createPlayer(p,homeTeam,true)
    );

  defensePlayers=
    defenseFormation.map(
      p=>createPlayer(p,awayTeam,false)
    );

  allPlayers=[
    ...offense,
    ...defensePlayers
  ];

  quarterback=
    allPlayers.find(
      p=>p.dataset.position==="QB"
    );
}

function createPlayer(data,team,isOffense){

  const el=document.createElement("div");

  el.className="player";
  el.dataset.position=data[0];
  el.textContent=data[0];

  el.style.left=data[1]+"%";
  el.style.top=data[2]+"%";

  el.style.background=
    isOffense?team[1]:team[2];

  el.style.borderColor=
    isOffense?team[2]:team[1];

  $("field").append(el);

  return el;
}

function update(){

  $("homeScore").textContent=homeScore;
  $("awayScore").textContent=awayScore;

  $("quarter").textContent=quarter;

  $("gameClock").textContent=
    Math.floor(gameClock/60)+":"+
    String(gameClock%60).padStart(2,"0");

  $("playClock").textContent=playClock;

  $("playClock").classList.toggle(
    "warning",
    playClock<=10
  );

  $("downDistance").textContent=
    down+" & "+yardsToGo;

  $("yardLine").textContent=ballYard;

  $("possession").textContent=possession;

  $("los").style.left=ballYard+"%";

  $("ball").style.left=ballYard+"%";
  $("ball").style.top="50%";

  $("losLabel").textContent=
    "LINE OF SCRIMMAGE — "+ballYard;
}

function resetPlayClock(){

  clearInterval(playTimer);

  playClock=40;
  update();

  playTimer=setInterval(()=>{

    if(!live)return;

    playClock--;

    if(playClock<=0){

      playClock=0;
      live=false;

      clearInterval(playTimer);

      down++;
      yardsToGo+=5;

      message(
        "PLAY CLOCK EXPIRED — 5 YARD PENALTY."
      );
    }

    update();

  },1000);
}

function snap(){

  if(live)return;

  live=true;

  resetPlayClock();

  message("PLAY LIVE — MOVE YOUR QB.");

  update();
}

function move(dx,dy){

  if(!live||!quarterback)return;

  let x=parseFloat(quarterback.style.left);
  let y=parseFloat(quarterback.style.top);

  x=Math.max(12,Math.min(88,x+dx));
  y=Math.max(8,Math.min(92,y+dy));

  quarterback.style.left=x+"%";
  quarterback.style.top=y+"%";

  defensePlayers.forEach(p=>{

    let px=parseFloat(p.style.left);
    let py=parseFloat(p.style.top);

    if(px>x)px-=.35;
    if(px<x)px+=.15;

    if(py<y)py+=.12;
    if(py>y)py-=.12;

    p.style.left=px+"%";
    p.style.top=py+"%";

    if(Math.hypot(px-x,py-y)<3){

      live=false;
      clearInterval(playTimer);

      message("SACK! PLAY STOPPED.");

      update();
    }
  });
}

function chooseReceiver(receiver){

  selectedReceiver=receiver;

  allPlayers.forEach(p=>{

    p.classList.toggle(
      "selected",
      p.dataset.position===receiver
    );
  });

  message("Receiver selected: "+receiver);
}

function runPlay(){

  if(!live)snap();

  let gain=Math.floor(Math.random()*8);

  if($("weather").value==="Rain")gain-=2;
  if($("weather").value==="Snow")gain-=3;

  finishPlay(
    "RUN",
    Math.max(0,gain)
  );
}

function passPlay(){

  if(!live)snap();

  let gain=Math.floor(Math.random()*16);

  if($("weather").value==="Wind")gain-=3;
  if($("weather").value==="Rain")gain-=2;

  finishPlay(
    "PASS TO "+selectedReceiver,
    Math.max(0,gain)
  );
}

function finishPlay(type,gain){

  clearInterval(playTimer);

  gameClock=Math.max(
    0,
    gameClock-12
  );

  yardsToGo-=gain;

  ballYard=Math.max(
    1,
    Math.min(99,ballYard+gain)
  );

  live=false;

  if(yardsToGo<=0){

    down=1;
    yardsToGo=10;

    message(type+" — FIRST DOWN!");

  }else{

    down++;

    message(
      type+
      " — GAIN OF "+
      gain+
      " YARDS. BALL ON "+
      ballYard+"."
    );

    if(down>4){

      changePossession(
        "TURNOVER ON DOWNS!"
      );

      return;
    }
  }

  if(gameClock<=0){

    nextQuarter();
    return;
  }

  resetFormation();
  resetPlayClock();
  update();
}

function punt(){

  if(!live)snap();

  clearInterval(playTimer);

  gameClock=Math.max(
    0,
    gameClock-15
  );

  live=false;

  const result=Math.random();

  if(result<.1){

    if(possession==="HOME")
      awayScore+=7;
    else
      homeScore+=7;

    message("PUNT RETURN TOUCHDOWN!");

  }else if(result<.25){

    if(possession==="HOME")
      awayScore+=3;
    else
      homeScore+=3;

    message("PUNT — FIELD GOAL!");

  }

  changePossession(
    "PUNT — POSSESSION CHANGES."
  );
}

function changePossession(text){

  possession=
    possession==="HOME"
    ?"AWAY"
    :"HOME";

  ballYard=25;
  down=1;
  yardsToGo=10;
  live=false;

  resetFormation();
  resetPlayClock();
  update();

  message(
    text||
    "POSSESSION CHANGES TO "+possession
  );
}

function resetFormation(){

  allPlayers.forEach(player=>{

    const data=
      offenseFormation.find(
        p=>p[0]===player.dataset.position
      )||
      defenseFormation.find(
        p=>p[0]===player.dataset.position
      );

    if(data){

      player.style.left=data[1]+"%";
      player.style.top=data[2]+"%";
    }

    player.classList.remove("selected");
  });

  quarterback=
    allPlayers.find(
      p=>p.dataset.position==="QB"
    );
}

function nextQuarter(){

  quarter++;

  if(quarter>4){

    quarter=4;
    live=false;

    clearInterval(playTimer);

    message("GAME OVER!");

  }else{

    gameClock=300;
    down=1;
    yardsToGo=10;
    ballYard=25;
    live=false;

    resetFormation();
    resetPlayClock();

    message(
      "QUARTER "+
      quarter+
      " — READY!"
    );
  }

  update();
}

function fullscreenGame(){

  if(document.fullscreenElement){

    document.exitFullscreen();

  }else{

    document.documentElement.requestFullscreen?.();
  }
}

function backToMenu(){

  clearInterval(playTimer);

  live=false;

  $("game").style.display="none";
  $("menu").style.display="block";
}

document.addEventListener(
  "keydown",
  event=>{

    if(event.code==="Space"){

      event.preventDefault();
      snap();
    }

    const k=event.key.toLowerCase();

    if(k==="w"||event.key==="ArrowUp")
      move(0,-2);

    if(k==="s"||event.key==="ArrowDown")
      move(0,2);

    if(k==="a"||event.key==="ArrowLeft")
      move(-2,0);

    if(k==="d"||event.key==="ArrowRight")
      move(2,0);
  }
);
</script>

</body>
</html>
