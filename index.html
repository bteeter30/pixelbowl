<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridiron Coach</title>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial;text-align:center}
button,select{padding:12px;margin:5px;border-radius:8px;font-weight:bold}
button{background:#e8bb4b;border:0}
#field{position:relative;margin:20px auto;background:#18723b;border:5px solid white;width:90%;max-width:1000px;aspect-ratio:16/9;background-image:repeating-linear-gradient(90deg,transparent 0 9%,#ffffff33 9% 10%)}
.player{position:absolute;width:30px;height:30px;border:2px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold}
.offense{background:#1680ff}
.defense{background:#e33}
.panel{padding:15px;background:#142238;margin:10px;border-radius:12px}
.hidden{display:none}
</style>
</head>
<body>

<div id="menu" class="panel">
<h1>🏈 GRIDIRON COACH</h1>

<select id="home">
<option>Detroit Lions</option>
<option>Dallas Cowboys</option>
<option>Kansas City Chiefs</option>
<option>Buffalo Bills</option>
<option>Green Bay Packers</option>
<option>Philadelphia Eagles</option>
</select>

<select id="away">
<option>New England Patriots</option>
<option>San Francisco 49ers</option>
<option>Miami Dolphins</option>
<option>Chicago Bears</option>
<option>New York Giants</option>
<option>Las Vegas Raiders</option>
</select>

<br>

<select id="weather">
<option>Clear</option>
<option>Rain</option>
<option>Snow</option>
<option>Windy</option>
<option>Night</option>
</select>

<br>
<button onclick="start()">START GAME</button>
<button onclick="document.documentElement.requestFullscreen()">FULLSCREEN</button>
</div>

<div id="game" class="hidden">

<div class="panel">
<h2>
<span id="awayName"></span>
<span id="awayScore">0</span>
-
<span id="homeScore">0</span>
<span id="homeName"></span>
</h2>

<h3>
<span id="quarter">Q1</span>
|
<span id="clock">5:00</span>
|
Down <span id="down">1</span>
&
<span id="distance">10</span>
</h3>

<p id="status">Press SNAP to begin.</p>
</div>

<div id="field"></div>

<div class="panel">
<button onclick="snap()">SNAP</button>
<button onclick="pass()">PASS</button>
<button onclick="run()">RUN</button>
<button onclick="kick()">KICK</button>
<button onclick="tackle()">TACKLE</button>
<button onclick="switchPlayer()">SWITCH PLAYER</button>
<button onclick="start()">RESTART</button>
</div>

<div class="panel">
<p>Controls: WASD / Arrow Keys to move</p>
<p>Space = Snap | P = Pass | R = Run | K = Kick | T = Tackle | C = Switch</p>
<div id="log"></div>
</div>

</div>

<script>
let state={
active:false,
quarter:1,
clock:300,
down:1,
distance:10,
home:0,
away:0,
pos:"home",
selected:0,
players:[]
};

const $=id=>document.getElementById(id);

function start(){
state={
active:false,
quarter:1,
clock:300,
down:1,
distance:10,
home:0,
away:0,
pos:"home",
selected:0,
players:[]
};

$("menu").classList.add("hidden");
$("game").classList.remove("hidden");

$("awayName").textContent=$("away").value;
$("homeName").textContent=$("home").value;

draw();
update();
log("Game started. Press SNAP.");
}

function log(text){
$("log").innerHTML="<p>"+text+"</p>"+$("log").innerHTML;
}

function update(){
$("homeScore").textContent=state.home;
$("awayScore").textContent=state.away;
$("quarter").textContent="Q"+state.quarter;
$("clock").textContent=Math.floor(state.clock/60)+":"+String(state.clock%60).padStart(2,"0");
$("down").textContent=state.down;
$("distance").textContent=state.distance;
}

function draw(){
$("field").innerHTML="";
state.players=[];

let offense=[
[30,50,"QB"],[25,40,"C"],[25,47,"G"],[25,53,"G"],
[25,60,"T"],[15,25,"WR"],[15,75,"WR"],
[18,40,"TE"],[18,60,"RB"],[8,35,"WR"],[8,65,"WR"]
];

let defense=[
[48,50,"DT"],[50,40,"DT"],[50,60,"DE"],
[58,30,"LB"],[58,45,"LB"],[58,55,"LB"],[58,70,"LB"],
[70,20,"CB"],[70,40,"CB"],[70,60,"S"],[70,80,"S"]
];

offense.forEach((p,i)=>create(p[0],p[1],"offense",p[2],i));
defense.forEach((p,i)=>create(p[0],p[1],"defense",p[2],i+20));
}

function create(x,y,type,label,index){
let p=document.createElement("div");
p.className="player "+type;
p.textContent=label;
p.style.left=x+"%";
p.style.top=y+"%";
p.dataset.index=index;
$("field").appendChild(p);
state.players.push(p);
}

function snap(){
state.active=true;
log("SNAP! Play started.");
}

function finish(yards,text){
if(!state.active){
log("Press SNAP first.");
return;
}

state.active=false;
state.distance-=yards;

if(yards>=25){
if(state.pos==="home")state.home+=7;
else state.away+=7;

log("TOUCHDOWN!");
state.down=1;
state.distance=10;
state.pos=state.pos==="home"?"away":"home";
}
else if(state.distance<=0){
log("FIRST DOWN!");
state.down=1;
state.distance=10;
}
else{
state.down++;

if(state.down>4){
log("TURNOVER ON DOWNS!");
state.down=1;
state.distance=10;
state.pos=state.pos==="home"?"away":"home";
}
else{
log(text+" for "+yards+" yards.");
}
}

update();
draw();
}

function pass(){
let yards=Math.floor(Math.random()*35)-10;
finish(yards,"Pass");
}

function run(){
let yards=Math.floor(Math.random()*18)-4;
finish(yards,"Run");
}

function tackle(){
let yards=-Math.floor(Math.random()*6+1);
finish(yards,"Tackle");
}

function kick(){
if(!state.active){
log("Press SNAP first.");
return;
}

state.active=false;

if(Math.random()>.25){
if(state.pos==="home")state.home+=3;
else state.away+=3;
log("FIELD GOAL GOOD!");
}
else{
log("FIELD GOAL MISSED!");
}

state.down=1;
state.distance=10;
state.pos=state.pos==="home"?"away":"home";

update();
draw();
}

function switchPlayer(){
state.selected=(state.selected+1)%11;
log("Switched player.");
}

document.addEventListener("keydown",e=>{
if(!$("game").classList.contains("hidden")){
if(e.code==="Space")snap();
if(e.key.toLowerCase()==="p")pass();
if(e.key.toLowerCase()==="r")run();
if(e.key.toLowerCase()==="k")kick();
if(e.key.toLowerCase()==="t")tackle();
if(e.key.toLowerCase()==="c")switchPlayer();

let p=state.players[state.selected];
if(!p)return;

let x=parseFloat(p.style.left);
let y=parseFloat(p.style.top);

if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")y-=2;
if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")y+=2;
if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")x-=2;
if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")x+=2;

p.style.left=x+"%";
p.style.top=y+"%";
}
});

setInterval(()=>{
if(state.active){
state.clock--;

if(state.clock<=0){
if(state.quarter<4){
state.quarter++;
state.clock=300;
log("END OF QUARTER");
}
else{
state.active=false;
log("GAME OVER!");
}
}

update();
}
},1000);
</script>

</body>
</html>
