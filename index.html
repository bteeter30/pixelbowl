<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Football 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #102238;
  border-bottom: 2px solid #facc15;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

button, select {
  padding: 11px 15px;
  border: 0;
  border-radius: 9px;
  background: #facc15;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #fde047;
}

.secondary {
  background: #30465f;
  color: white;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 15px;
}

.panel {
  background: #102238;
  border: 1px solid #34516e;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
}

.hidden {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 10px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 14px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.stat {
  background: #071522;
  border-radius: 9px;
  padding: 10px;
  text-align: center;
  font-size: 12px;
}

.stat b {
  display: block;
  color: #facc15;
  font-size: 21px;
  margin-top: 5px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

#world {
  height: 550px;
  position: relative;
  overflow: hidden;
  border: 5px solid white;
  border-radius: 12px;
  background: #237b45;
}

#field {
  position: absolute;
  inset: -15%;
  transform: perspective(850px) rotateX(53deg) scale(1.12);
  background: repeating-linear-gradient(
    90deg,
    #1c7140 0 9.09%,
    #25864b 9.09% 18.18%
  );
  border: 5px solid white;
}

#field::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent 0 9.6%,
    #ffffffaa 9.6% 10%
  );
  pointer-events: none;
}

.endzone {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 12%;
  border: 3px solid white;
}

.left {
  left: 0;
  background: #194b99aa;
}

.right {
  right: 0;
  background: #991b1baa;
}

.player {
  position: absolute;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  border: 3px solid white;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: bold;
  z-index: 2;
  box-shadow: 0 2px 5px #0008;
}

.offense {
  background: #2563eb;
}

.defense {
  background: #dc2626;
}

.quarterback {
  background: #facc15;
  color: #111;
}

.ball {
  background: #8b4513;
  border-color: #f5d0a0;
}

#overlay {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 3;
  background: #071522dd;
  padding: 11px;
  border-radius: 9px;
  font-size: 13px;
}

#log {
  height: 120px;
  overflow: auto;
  background: #071522;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
  margin-top: 12px;
}

@media (max-width: 700px) {
  .stats {
    grid-template-columns: repeat(3, 1fr);
  }

  #world {
    height: 420px;
  }

  header {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <strong>🏈 GRIDIRON 3D</strong>
  <span>Football Career Prototype</span>
  <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
</header>

<main>

<section id="menu" class="panel">

  <h1>Game Center</h1>

  <p>
    Choose a game mode, team, and weather.
  </p>

  <div class="grid">
    <button onclick="startGame('Play Now')">
      Play Now
    </button>

    <button onclick="startGame('Franchise')">
      Franchise
    </button>

    <button onclick="startGame('Superstar')">
      Superstar
    </button>

    <button onclick="startGame('Ultimate Team')">
      Ultimate Team
    </button>
  </div>

  <div class="controls">

    <label>
      Team:
      <select id="team">
        <option>Detroit Lions</option>
        <option>Dallas Cowboys</option>
        <option>Green Bay Packers</option>
        <option>Kansas City Chiefs</option>
        <option>Buffalo Bills</option>
        <option>San Francisco 49ers</option>
        <option>Philadelphia Eagles</option>
        <option>Miami Dolphins</option>
      </select>
    </label>

    <label>
      Weather:
      <select id="weather">
        <option>Clear</option>
        <option>Rain</option>
        <option>Snow</option>
        <option>Wind</option>
        <option>Night</option>
      </select>
    </label>

  </div>

</section>

<section id="game" class="hidden">

  <section class="panel">

    <div class="row">
      <h2 id="title">Exhibition</h2>

      <button
        class="secondary"
        onclick="backToMenu()">
        Main Menu
      </button>
    </div>

    <div class="stats">

      <div class="stat">
        HOME
        <b id="homeScore">0</b>
      </div>

      <div class="stat">
        AWAY
        <b id="awayScore">0</b>
      </div>

      <div class="stat">
        QUARTER
        <b id="quarter">1</b>
      </div>

      <div class="stat">
        CLOCK
        <b id="clock">5:00</b>
      </div>

      <div class="stat">
        DOWN
        <b id="down">1 & 10</b>
      </div>

    </div>

    <p id="status">
      Press Snap to begin the play.
    </p>

  </section>

  <div id="world">

    <div id="field">

      <div class="endzone left"></div>
      <div class="endzone right"></div>

    </div>

    <div id="overlay">

      Weather:
      <b id="weatherText">Clear</b>

      <br>

      Crowd:
      <b id="crowd">65%</b>

    </div>

  </div>

  <section class="panel">

    <div class="row">

      <b>
        WASD / Arrow keys: Move quarterback
      </b>

      <span>
        HOME BALL
      </span>

    </div>

    <div class="controls">

      <button onclick="snap()">
        Snap
      </button>

      <button onclick="runPlay()">
        Run
      </button>

      <button onclick="passPlay()">
        Pass
      </button>

      <button onclick="kick()">
        Kick
      </button>

      <button onclick="changeWeather()">
        Weather
      </button>

      <button
        class="secondary"
        onclick="resetPlay()">
        Reset
      </button>

    </div>

    <div id="log"></div>

  </section>

</section>

</main>

<script>

const $ = id => document.getElementById(id);

let clock = 300;
let quarter = 1;
let down = 1;
let togo = 10;
let homeScore = 0;
let awayScore = 0;
let crowd = 65;
let weather = "Clear";
let live = false;

let qbX = 20;
let qbY = 50;

function writeLog(message) {

  $("log").innerHTML =
    "<div>" + message + "</div>" +
    $("log").innerHTML;

}

function startGame(mode) {

  weather = $("weather").value;

  $("menu").classList.add("hidden");
  $("game").classList.remove("hidden");

  $("title").textContent =
    $("team").value + " — " + mode;

  clock = 300;
  quarter = 1;
  down = 1;
  togo = 10;
  homeScore = 0;
  awayScore = 0;
  crowd = 65;
  live = false;

  drawPlayers();
  updateStats();

  writeLog(
    "Started " + mode +
    " in " + weather + " weather."
  );

}

function backToMenu() {

  $("game").classList.add("hidden");
  $("menu").classList.remove("hidden");

}

function updateStats() {

  $("homeScore").textContent = homeScore;
  $("awayScore").textContent = awayScore;
  $("quarter").textContent = quarter;

  $("clock").textContent =
    Math.floor(clock / 60) + ":" +
    String(clock % 60).padStart(2, "0");

  $("down").textContent =
    down + " & " + togo;

  $("crowd").textContent =
    crowd + "%";

  $("weatherText").textContent =
    weather;

}

function createPlayer(x, y, number, type) {

  const player = document.createElement("div");

  player.className =
    "player " + type;

  player.textContent = number;

  player.style.left = x + "%";
  player.style.top = y + "%";

  $("field").appendChild(player);

}

function drawPlayers() {

  const field = $("field");

  field
    .querySelectorAll(".player")
    .forEach(player => player.remove());

  const offense = [

    [20, 50, "QB"],
    [28, 40, 2],
    [28, 47, 3],
    [28, 53, 4],
    [28, 60, 5],
    [38, 30, 6],
    [38, 70, 7],
    [45, 42, 8],
    [45, 58, 9],
    [50, 25, 10],
    [50, 75, 11]

  ];

  const defense = [

    [65, 25, 1],
    [65, 75, 2],
    [70, 35, 3],
    [70, 65, 4],
    [73, 45, 5],
    [73, 55, 6],
    [80, 30, 7],
    [80, 70, 8],
    [84, 42, 9],
    [84, 58, 10],
    [88, 50, 11]

  ];

  offense.forEach(player => {

    createPlayer(
      player[0],
      player[1],
      player[2],
      player[2] === "QB"
        ? "offense quarterback"
        : "offense"
    );

  });

  defense.forEach(player => {

    createPlayer(
      player[0],
      player[1],
      player[2],
      "defense"
    );

  });

  createPlayer(
    qbX,
    qbY,
    "🏈",
    "ball"
  );

}

function moveQuarterback(dx, dy) {

  qbX = Math.max(
    5,
    Math.min(95, qbX + dx)
  );

  qbY = Math.max(
    8,
    Math.min(92, qbY + dy)
  );

  drawPlayers();

  crowd = Math.min(
    100,
    crowd + 1
  );

  updateStats();

}

function snap() {

  live = true;

  clock = Math.max(
    0,
    clock - 8
  );

  $("status").textContent =
    "Play live! Move the quarterback.";

  writeLog("Snap! The play has started.");

  updateStats();

}

function runPlay() {

  if (!live) {
    snap();
  }

  completePlay("Run");

}

function passPlay() {

  if (!live) {
    snap();
  }

  completePlay("Pass");

}

function completePlay(type) {

  let gain =
    Math.floor(Math.random() * 10) + 1;

  if (weather === "Rain") {
    gain -= 2;
  }

  if (weather === "Snow") {
    gain -= 3;
  }

  if (
    weather === "Wind" &&
    type === "Pass"
  ) {
    gain -= 4;
  }

  gain = Math.max(0, gain);

  clock = Math.max(
    0,
    clock - 12
  );

  togo -= gain;

  if (togo <= 0) {

    down = 1;
    togo = 10;
    crowd = Math.min(100, crowd + 8);

    writeLog(
      type +
      " gained " +
      gain +
      " yards — first down!"
    );

  } else {

    down++;

    writeLog(
      type +
      " gained " +
      gain +
      " yards."
    );

    if (down > 4) {

      down = 1;
      togo = 10;

      writeLog(
        "Turnover on downs."
      );

    }

  }

  if (Math.random() < 0.08) {

    homeScore += 7;

    crowd = Math.min(
      100,
      crowd + 15
    );

    writeLog(
      "TOUCHDOWN!"
    );

  }

  if (clock === 0) {

    quarter++;
    clock = 300;

    writeLog(
      "Quarter ended."
    );

  }

  $("status").textContent =
    type + " play finished.";

  updateStats();

}

function kick() {

  clock = Math.max(
    0,
    clock - 10
  );

  if (Math.random() < 0.7) {

    homeScore += 3;

    writeLog(
      "Field goal good!"
    );

  } else {

    writeLog(
      "Field goal missed."
    );

  }

  updateStats();

}

function resetPlay() {

  live = false;

  qbX = 20;
  qbY = 50;

  down = 1;
  togo = 10;

  drawPlayers();
  updateStats();

  writeLog(
    "Play reset."
  );

}

function changeWeather() {

  const conditions = [
    "Clear",
    "Rain",
    "Snow",
    "Wind",
    "Night"
  ];

  const index =
    conditions.indexOf(weather);

  weather =
    conditions[
      (index + 1) % conditions.length
    ];

  if (weather === "Night") {

    $("world").style.filter =
      "brightness(0.55)";

  } else if (weather === "Rain") {

    $("world").style.filter =
      "saturate(0.8)";

  } else if (weather === "Snow") {

    $("world").style.filter =
      "brightness(1.2)";

  } else {

    $("world").style.filter =
      "none";

  }

  writeLog(
    "Weather changed to " +
    weather + "."
  );

  updateStats();

}

function toggleFullscreen() {

  if (!document.fullscreenElement) {

    document.documentElement
      .requestFullscreen?.();

  } else {

    document.exitFullscreen?.();

  }

}

document.addEventListener(
  "keydown",
  event => {

    const key =
      event.key.toLowerCase();

    if (
      key === "w" ||
      event.key === "ArrowUp"
    ) {

      moveQuarterback(0, -3);

    }

    if (
      key === "s" ||
      event.key === "ArrowDown"
    ) {

      moveQuarterback(0, 3);

    }

    if (
      key === "a" ||
      event.key === "ArrowLeft"
    ) {

      moveQuarterback(-3, 0);

    }

    if (
      key === "d" ||
      event.key === "ArrowRight"
    ) {

      moveQuarterback(3, 0);

    }

    if (event.code === "Space") {

      event.preventDefault();
      snap();

    }

  }
);

</script>

</body>
</html>
