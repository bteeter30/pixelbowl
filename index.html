<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Football</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07111f;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
}
button,select{
 padding:10px 14px;
 border:0;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}
button{background:#facc15;color:#111}
button.secondary{background:#263c55;color:white}
#menu{padding:20px;max-width:800px;margin:auto}
#menu h1{color:#facc15}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;margin:12px 0}
select{width:100%;background:#263c55;color:white}
#game{display:none;height:100vh;position:relative}
#field{
 position:absolute;
 inset:0;
 overflow:hidden;
 background:
 repeating-linear-gradient(
  90deg,#207844 0,#207844 9.09%,
  #26894e 9.09%,#26894e 18.18%
 );
 border:4px solid white;
}
#field:before{
 content:"";
 position:absolute;
 inset:0;
 background:repeating-linear-gradient(
  90deg,transparent 0%,transparent 9.6%,
  #ffffffaa 9.6%,#ffffffaa 10%
 );
}
.endzone{
 position:absolute;
 top:0;
 bottom:0;
 width:12%;
 border:3px solid white;
}
.endzone.left{left:0;background:#194b99}
.endzone.right{right:0;background:#b45309}
.player{
 position:absolute;
 width:34px;
 height:34px;
 border-radius:50%;
 border:3px solid white;
 transform:translate(-50%,-50%);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:10px;
 font-weight:bold;
 z-index:3;
 transition:left .12s,top .12s;
}
.home{background:#2563eb}
.away{background:#dc2626}
.ball{background:#8b4513;border-color:#f5d0a0}
.selected{box-shadow:0 0 0 4px #facc15}
#scoreboard{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 background:#101b2c;
 border-top:2px solid #facc15;
 padding:10px;
 z-index:10;
}
.scoreRow{
 display:flex;
 justify-content:space-around;
 align-items:center;
 text-align:center;
 gap:8px;
}
.scoreRow b{display:block;font-size:20px;color:#facc15}
#controls{
 position:absolute;
 bottom:90px;
 left:15px;
 z-index:10;
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 max-width:340px;
}
#message{
 position:absolute;
 top:15px;
 left:50%;
 transform:translateX(-50%);
 background:#071522dd;
 padding:12px;
 border-radius:8px;
 z-index:10;
 text-align:center;
}
#receiverPanel{
 position:absolute;
 right:15px;
 bottom:90px;
 z-index:10;
 background:#071522dd;
 padding:12px;
 border-radius:10px;
}
#receiverPanel button{margin:3px}
@media(max-width:600px){
 .player{width:28px;height:28px;font-size:8px}
 .scoreRow b{font-size:15px}
 #controls{bottom:105px;max-width:220px}
 #receiverPanel{right:8px;bottom:105px}
}
</style>
</head>
<body>

<section id="menu">
<h1>🏈 GRIDIRON FOOTBALL</h1>
<p>Choose your teams and start a prototype game.</p>

<label>Home Team
<select id="homeTeam">
<option value="DET">Detroit Lions</option>
<option value="CLE">Cleveland Browns</option>
<option value="DAL">Dallas Cowboys</option>
<option value="BUF">Buffalo Bills</option>
<option value="GB">Green Bay Packers</option>
<option value="PHI">Philadelphia Eagles</option>
<option value="KC">Kansas City Chiefs</option>
<option value="SF">San Francisco 49ers</option>
<option value="LV">Las Vegas Raiders</option>
<option value="MIA">Miami Dolphins</option>
</select>
</label>

<label>Away Team
<select id="awayTeam">
<option value="CLE">Cleveland Browns</option>
<option value="DET">Detroit Lions</option>
<option value="DAL">Dallas Cowboys</option>
<option value="BUF">Buffalo Bills</option>
<option value="GB">Green Bay Packers</option>
<option value="PHI">Philadelphia Eagles</option>
<option value="KC">Kansas City Chiefs</option>
<option value="SF">San Francisco 49ers</option>
<option value="LV">Las Vegas Raiders</option>
<option value="MIA">Miami Dolphins</option>
</select>
</label>

<label>Weather
<select id="weather">
<option>Clear</option>
<option>Rain</option>
<option>Snow</option>
<option>Wind</option>
<option>Night</option>
</select>
</label>

<button onclick="startGame()">START GAME</button>
</section>

<section id="game">
<div id="field">
<div class="endzone left"></div>
<div class="endzone right"></div>
</div>

<div id="message">Press SNAP to begin</div>

<div id="controls">
<button onclick="snap()">SNAP</button>
<button onclick="runPlay()">RUN</button>
<button onclick="passPlay()">PASS</button>
<button onclick="punt()">PUNT</button>
<button onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
<button class="secondary" onclick="backMenu()">MENU</button>
</div>

<div id="receiverPanel">
<b>PASS TO</b><br>
<button onclick="selectReceiver(1)">WR1</button>
<button onclick="selectReceiver(2)">WR2</button>
<button onclick="selectReceiver(3)">TE</button>
</div>

<div id="scoreboard">
<div class="scoreRow">
<div id="homeLabel">HOME<b id="homeScore">0</b></div>
<div>QTR <b id="quarter">1</b></div>
<div>CLOCK <b id="clock">5:00</b></div>
<div>DOWN <b id="down">1 & 10</b></div>
<div id="awayLabel">AWAY<b id="awayScore">0</b></div>
</div>
</div>
</section>

<script>
const $=id=>document.getElementById(id);

const teams={
DET:{name:"Detroit Lions",primary:"#0076b6",secondary:"#b0b7bc"},
CLE:{name:"Cleveland Browns",primary:"#ff3c00",secondary:"#311d00"},
DAL:{name:"Dallas Cowboys",primary:"#003594",secondary:"#869397"},
BUF:{name:"Buffalo Bills",primary:"#00338d",secondary:"#c60c30"},
GB:{name:"Green Bay Packers",primary:"#203731",secondary:"#ffb612"},
PHI:{name:"Philadelphia Eagles",primary:"#004c54",secondary:"#a5acaf"},
KC:{name:"Kansas City Chiefs",primary:"#e31837",secondary:"#ffb81c"},
SF:{name:"San Francisco 49ers",primary:"#aa0000",secondary:"#b3995d"},
LV:{name:"Las Vegas Raiders",primary:"#000000",secondary:"#a5acaf"},
MIA:{name:"Miami Dolphins",primary:"#008e97",secondary:"#fc4c02"}
};

let homeTeam,awayTeam;
let clock=300,quarter=1,down=1,toGo=10;
let homeScore=0,awayScore=0;
let live=false,selectedReceiver=1;
let players=[],qb;
let possession="HOME";

const offense=[
 {id:"QB",x:43,y:50,role:"QB"},
 {id:"C",x:39,y:50,role:"C"},
 {id:"LG",x:39,y:43,role:"OL"},
 {id:"RG",x:39,y:57,role:"OL"},
 {id:"LT",x:39,y:36,role:"OL"},
 {id:"RT",x:39,y:64,role:"OL"},
 {id:"WR1",x:30,y:20,role:"WR"},
 {id:"WR2",x:30,y:80,role:"WR"},
 {id:"TE",x:34,y:70,role:"TE"},
 {id:"RB",x:35,y:50,role:"RB"},
 {id:"FB",x:36,y:44,role:"FB"}
];

const defense=[
 {id:"DE1",x:53,y:36},
 {id:"DT1",x:53,y:45},
 {id:"DT2",x:53,y:55},
 {id:"DE2",x:53,y:64},
 {id:"LB1",x:59,y:40},
 {id:"LB2",x:59,y:50},
 {id:"LB3",x:59,y:60},
 {id:"CB1",x:67,y:20},
 {id:"CB2",x:67,y:80},
 {id:"S1",x:76,y:35},
 {id:"S2",x:76,y:65}
];

function startGame(){
 homeTeam=teams[$("homeTeam").value];
 awayTeam=teams[$("awayTeam").value];

 $("menu").style.display="none";
 $("game").style.display="block";

 $("homeLabel").firstChild.textContent=homeTeam.name+" ";
 $("awayLabel").firstChild.textContent=awayTeam.name+" ";

 clock=300;quarter=1;down=1;toGo=10;
 homeScore=0;awayScore=0;live=false;

 $("field").style.filter=$("weather").value==="Night"?"brightness(.55)":"none";

 createPlayers();
 updateScoreboard();
 message("Ready for kickoff.");
}

function createPlayers(){
 $("field").querySelectorAll(".player").forEach(p=>p.remove());
 players=[];

 offense.forEach(p=>{
  let e=makePlayer(p,homeTeam,true);
  players.push(e);
  if(p.id==="QB")qb=e;
 });

 defense.forEach(p=>{
  let e=makePlayer(p,awayTeam,false);
  players.push(e);
 });
}

function makePlayer(p,team,isHome){
 let e=document.createElement("div");
 e.className="player "+(isHome?"home":"away");
 e.textContent=p.id;
 e.style.left=p.x+"%";
 e.style.top=p.y+"%";
 e.style.background=isHome?team.primary:team.secondary;
 e.style.borderColor=isHome?team.secondary:team.primary;
 e.dataset.id=p.id;
 $("field").appendChild(e);
 return e;
}

function message(text){
 $("message").textContent=text;
}

function updateScoreboard(){
 $("homeScore").textContent=homeScore;
 $("awayScore").textContent=awayScore;
 $("quarter").textContent=quarter;
 $("clock").textContent=Math.floor(clock/60)+":"+String(clock%60).padStart(2,"0");
 $("down").textContent=down+" & "+toGo;
}

function snap(){
 if(live)return;
 live=true;
 clock=Math.max(0,clock-8);
 message("PLAY LIVE — move the quarterback.");
 updateScoreboard();
}

function moveQB(dx,dy){
 if(!live||!qb)return;

 let x=parseFloat(qb.style.left)+dx;
 let y=parseFloat(qb.style.top)+dy;

 qb.style.left=Math.max(5,Math.min(95,x))+"%";
 qb.style.top=Math.max(8,Math.min(92,y))+"%";

 moveDefense();
}

function moveDefense(){
 players.filter(p=>p.classList.contains("away")).forEach(p=>{
  let x=parseFloat(p.style.left);
  let y=parseFloat(p.style.top);
  let qx=parseFloat(qb.style.left);
  let qy=parseFloat(qb.style.top);

  if(x>qx){
   x-=.35;
   if(y<qy)y+=.12;
   if(y>qy)y-=.12;
  }

  p.style.left=x+"%";
  p.style.top=y+"%";
 });
}

function runPlay(){
 if(!live)snap();

 let gain=Math.floor(Math.random()*8)+1;

 if($("weather").value==="Rain")gain-=2;
 if($("weather").value==="Snow")gain-=3;

 gain=Math.max(0,gain);
 finishPlay("Run",gain);
}

function passPlay(){
 if(!live)snap();

 let gain=Math.floor(Math.random()*16)+2;

 if($("weather").value==="Wind")gain-=3;
 if($("weather").value==="Rain")gain-=2;

 gain=Math.max(0,gain);

 finishPlay("Pass to "+selectedReceiver,gain);
}

function selectReceiver(num){
 selectedReceiver=num;
 message("Receiver selected: "+num);
}

function finishPlay(type,gain){
 clock=Math.max(0,clock-12);
 toGo-=gain;

 if(toGo<=0){
  down=1;
  toGo=10;
  message(type+" — FIRST DOWN!");
 }else{
  down++;
  message(type+" gained "+gain+" yards.");

  if(down>4){
   down=1;
   toGo=10;
   message("Turnover on downs.");
  }
 }

 if(Math.random()<.04){
  homeScore+=7;
  message("TOUCHDOWN!");
 }

 if(clock===0){
  quarter++;
  clock=300;
 }

 live=false;
 updateScoreboard();
}

function punt(){
 if(!live)snap();

 clock=Math.max(0,clock-15);
 down=1;
 toGo=10;
 live=false;
 message("Punt away!");
 updateScoreboard();
}

function toggleFullscreen(){
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
 }
}

function backMenu(){
 $("game").style.display="none";
 $("menu").style.display="block";
}

document.addEventListener("keydown",e=>{
 if(e.code==="Space"){
  e.preventDefault();
  snap();
 }

 if(e.key.toLowerCase()==="w"||e.key==="ArrowUp")
  moveQB(0,-2);

 if(e.key.toLowerCase()==="s"||e.key==="ArrowDown")
  moveQB(0,2);

 if(e.key.toLowerCase()==="a"||e.key==="ArrowLeft")
  moveQB(-2,0);

 if(e.key.toLowerCase()==="d"||e.key==="ArrowRight")
  moveQB(2,0);
});
</script>
</body>
</html>
